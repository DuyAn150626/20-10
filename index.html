<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <!-- Nhúng Font chữ chuẩn như video -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <!-- Tiêu đề lấp lánh phía trên -->
        <div class="header-title">Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</div>

        <!-- MÀN CHUYỂN CẢNH 1: Đóa hoa hạt ánh sáng 3D & Bung nở Album ảnh -->
        <div id="scene-bloom" class="active-layer">
            <canvas id="flower-canvas"></canvas>
            <div id="photo-album-3d" class="album-container">
                <div class="card-item-3d active" data-index="0">Mong album ảnh của chị ngày càng xịn 💕</div>
                <div class="card-item-3d" data-index="1">Chúc chị ngủ ngon, ngủ rồi thì có một giấc ngủ ngon nha 😴</div>
                <div class="card-item-3d" data-index="2">Mong chị luôn bình an và sức khỏe mạnh 💪</div>
                <div class="card-item-3d" data-index="3">Chị nhớ chăm sóc tốt cho bản thân nhé, đừng lười ăn đấy 🍲</div>
            </div>
            <button id="btn-next-scene" class="nav-button">Mở thư chúc mừng 20/10 ➔</button>
        </div>

        <!-- MÀN CHUYỂN CẢNH 2: Bức thư lật nắp tự động & Hiệu ứng máy gõ chữ -->
        <div id="scene-letter" class="hidden-layer">
            <div class="envelope-wrapper" id="envelope">
                <div class="envelope-back"></div>
                <div class="envelope-flap"></div>
                <!-- Ruột thư chứa hiệu ứng máy đánh chữ gõ tự động -->
                <div class="letter-paper">
                    <div class="letter-avatar">🐱</div>
                    <h3 class="letter-title">Chúc mừng ngày 20/10</h3>
                    <div id="typewriter-text" class="text-content"></div>
                    <button id="btn-restart" class="nav-button-sub">↩ Đọc lại từ đầu</button>
                </div>
                <div class="envelope-front"></div>
            </div>
        </div>
    </div>

    <!-- Hệ thống âm thanh phát đúng bài nhạc nền lãng mạn như video -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <script src="script.js"></script>
</body>
</html>
