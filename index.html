<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <!-- LIÊN KẾT ĐẾN FILE STYLE.CSS CỦA BẠN -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="instruction" id="guide">✉️ Hãy chạm vào bức thư màu hồng để mở điều bất ngờ 🌸</div>

    <!-- Không gian chứa thư và hiệu ứng nở hoa -->
    <div class="envelope-container" id="envelope-box">
        <div class="envelope-back"></div>
        <div class="envelope-flap"></div>
        
        <!-- Bó hoa giấu kín ban đầu -->
        <div class="bouquet-box">
            <!-- Giấy gói hoa hình nón -->
            <div class="cone-wrap"></div>
            
            <!-- Cụm hoa tự động bung nở từng bông -->
            <div class="flowers-cluster">
                <div class="flower fl1"></div>
                <div class="flower fl2"></div>
                <div class="flower fl3"></div>
                <div class="flower fl4"></div>
                <div class="flower fl5"></div>
                <!-- Bông hồng đỏ thắm nở to nhất ở chính giữa -->
                <div class="red-rose" id="center-rose">
                    <div class="rose-core"></div>
                </div>
            </div>
        </div>
        
        <div class="envelope-front"></div>
    </div>

    <!-- Khung kính mờ chứa lời chúc hiển thị cuối cùng -->
    <div class="wishes-card" id="wishes-box">
        <h2>Happy 20/10! 💐</h2>
        <p>Chúc người phụ nữ tuyệt vời luôn rạng rỡ, kiêu sa như đóa hồng đỏ thắm, tràn đầy niềm vui, hạnh phúc và luôn nhận được sự trân trọng, yêu thương trọn vẹn mỗi ngày!</p>
    </div>

    <!-- Âm thanh nền lãng mạn nhẹ nhàng -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <!-- LIÊN KẾT ĐẾN FILE SCRIPT.JS CỦA BẠN -->
    <script src="script.js"></script>
</body>
</html>
