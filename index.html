<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Yêu 3D - 20/10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle, #2a082c 0%, #08000a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Hướng dẫn góc màn hình */
        .instruction {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #ff9ebb;
            font-size: 1.1rem;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 75, 145, 0.5);
            pointer-events: none;
            animation: pulse 2s infinite alternate;
            padding: 0 10px;
            box-sizing: border-box;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Bảng lời chúc hiện ra cuối cùng (Glassmorphism) */
        #wishes-card {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 158, 187, 0.3);
            border-radius: 20px;
            padding: 25px 30px;
            width: 85%;
            max-width: 450px;
            color: #fff;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 75, 145, 0.2);
            z-index: 10;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
        }

        #wishes-card.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        #wishes-card h2 {
            color: #ff4b91;
            margin-top: 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 75, 145, 0.4);
            margin-bottom: 12px;
        }

        #wishes-card p {
            font-size: 1rem;
            line-height: 1.6;
            color: #ffe3ec;
            margin: 0;
        }
    </style>
    <!-- Tải các thư viện đồ họa 3D cốt lõi từ CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="instruction" id="guide">✉️ Hãy chạm vào bức thư màu hồng để mở điều bất ngờ 🌸</div>

    <div id="canvas-container"></div>

    <div id="wishes-card">
        <h2>Happy 20/10! 💐</h2>
        <p>Chúc người phụ nữ tuyệt vời nhận được bức thư này luôn rạng rỡ như đóa hoa hồng đỏ thắm, tràn đầy hạnh phúc, niềm vui và luôn được yêu thương trọn vẹn mỗi ngày!</p>
    </div>

    <!-- Nhạc nền nhẹ nhàng tự động phát khi có tương tác click trước lệnh trình duyệt -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <script>
        // --- 1. KHỞI TẠO KHÔNG GIAN THIẾT KẾ 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x08000a, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 2. HỆ THỐNG ÁNH SÁNG 3D ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffe3ec, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff4b91, 1.8, 20);
        pointLight.position.set(0, 0, 2);
        scene.add(pointLight);

        // --- 3. MÔ HÌNH HÓA BỨC THƯ 3D ---
        const envelopeGroup = new THREE.Group();
        scene.add(envelopeGroup);

        const bodyGeo = new THREE.BoxGeometry(4.5, 3, 0.08);
        const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff75a0, roughness: 0.4, metalness: 0.1 });
        const envelopeBody = new THREE.Mesh(bodyGeo, pinkMat);
        envelopeGroup.add(envelopeBody);

        const flapGroup = new THREE.Group();
        flapGroup.position.set(0, 1.5, 0.04);
        envelopeGroup.add(flapGroup);

        const flapShape = new THREE.Shape();
        flapShape.moveTo(-2.25, 0);
        flapShape.lineTo(2.25, 0);
        flapShape.lineTo(0, 1.5);
        flapShape.lineTo(-2.25, 0);
        const flapGeo = new THREE.ShapeGeometry(flapShape);
        const darkPinkMat = new THREE.MeshStandardMaterial({ color: 0xff4b91, side: THREE.DoubleSide });
        const envelopeFlap = new THREE.Mesh(flapGeo, darkPinkMat);
        flapGroup.add(envelopeFlap);

        // --- 4. KHÔNG GIAN BÓ HOA VÀ ĐÓA HỒNG ĐỎ ---
        const bouquetGroup = new THREE.Group();
        bouquetGroup.position.set(0, -0.5, 0.2);
        bouquetGroup.scale.set(0, 0, 0); 
        scene.add(bouquetGroup);

        const coneGeo = new THREE.ConeGeometry(1.2, 3, 32, 1, true);
        const wrapMat = new THREE.MeshStandardMaterial({ color: 0xffb3c6, side: THREE.DoubleSide, roughness: 0.5 });
        const cone = new THREE.Mesh(coneGeo, wrapMat);
        cone.rotation.x = Math.PI;
        cone.position.y = -0.5;
        bouquetGroup.add(cone);

        function createRoseMesh(colorHex, size) {
            const rose = new THREE.Group();
            const petalCount = 8;
            for(let i=0; i<petalCount; i++) {
                const petalGeo = new THREE.SphereGeometry(size * (1 - i*0.08), 16, 16);
                const petalMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 });
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.scale.set(1, 0.4, 1);
                petal.rotation.x = Math.random() * 0.4;
                petal.rotation.y = (i * Math.PI / 3) + Math.random()*0.2;
                petal.position.set(Math.sin(i)*0.08, i*0.03, Math.cos(i)*0.08);
                rose.add(petal);
            }
            return rose;
        }

        // Bông hồng đỏ thắm ở vị trí trung tâm
        const centerRedRose = createRoseMesh(0xdc143c, 0.52);
        centerRedRose.position.set(0, 1, 0);
        bouquetGroup.add(centerRedRose);

        const positions = [
            [0.4, 0.9, 0.2], [-0.4, 0.9, 0.2], [0.2, 0.9, -0.4], 
            [-0.2, 0.9, -0.4], [0.4, 0.8, -0.1], [-0.4, 0.8, -0.1]
        ];
        positions.forEach(pos => {
            const pinkRose = createRoseMesh(0xff69b4, 0.4);
            pinkRose.position.set(pos[0], pos[1], pos[2]);
            bouquetGroup.add(pinkRose);
        });

        // --- 5. HỆ THỐNG MƯA CÁNH HOA LƠ LỬNG ---
        const particleCount = 120;
        const particleGeometry = new THREE.BufferGeometry();
        const positionsArr = new Float32Array(particleCount * 3);
        const speedsArr = new Float32Array(particleCount);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positionsArr[i] = (Math.random() - 0.5) * 20;
            positionsArr[i + 1] = Math.random() * 20 + 5;
            positionsArr[i + 2] = (Math.random() - 0.5) * 10;
            speedsArr[i / 3] = Math.random() * 0.04 + 0.02;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positionsArr, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffb3d1,
            size: 0.16,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });

        const flowerParticles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(flowerParticles);

        // --- 6. XỬ LÝ SỰ KIỆN TƯƠNG TÁC (RAYCASTER & TWEEN) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let step = 0; 
        const bgMusic = document.getElementById('bg-music');

        function startInteraction(clientX, clientY) {
            // Tự kích hoạt chạy nhạc nền do luật bảo mật trình duyệt chặn autoplay
            if (bgMusic.paused) {
                bgMusic.play().catch(() => {});
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (step === 0) {
                const intersects = raycaster.intersectObjects(envelopeGroup.children, true);
                if (intersects.length > 0) openEnvelope();
            } else if (step === 1) {
                const intersects = raycaster.intersectObjects(bouquetGroup.children, true);
                if (intersects.length > 0) showWishes();
            }
        }

        window.addEventListener('click', (e) => startInteraction(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
Hãy thận trọng khi sử dụng mã.
if(e.touches.length > 0) startInteraction(e.touches[0].clientX, e.touches[0].clientY);
});
function openEnvelope() {
step = -1;
document.getElementById('guide').innerText = "🌹 Hãy chạm vào đóa hoa hồng đỏ ở giữa...";
new TWEEN.Tween(flapGroup.rotation).to({ x: Math.PI * 0.95 }, 1200).easing(TWEEN.Easing.Quadratic.Out).start();
new TWEEN.Tween(envelopeGroup.position).to({ y: -2, z: -1 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
new TWEEN.Tween(bouquetGroup.scale)
.to({ x: 1.8, y: 1.8, z: 1.8 }, 2000)
.delay(400)
.easing(TWEEN.Easing.Back.Out)
.onComplete(() => { step = 1; })
.start();
}
function showWishes() {
step = 2;
document.getElementById('guide').style.display = 'none';
new TWEEN.Tween(centerRedRose.scale).to({ x: 1.3, y: 1.3, z: 1.3 }, 300).yoyo(true).repeat(3).start();
new TWEEN.Tween(bouquetGroup.position).to({ x: 0, y: 0.6, z: 4 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
new TWEEN.Tween(bouquetGroup.rotation)
.to({ y: Math.PI * 2, x: 0.25 }, 2000)
.easing(TWEEN.Easing.Quart.Out)
.onComplete(() => {
document.getElementById('wishes-card').classList.add('show');
})
.start();
}
// --- 7. VÒNG LẶP RENDER CHUYỂN ĐỘNG ---
const posAttribute = flowerParticles.geometry.getAttribute('position');
function animate(time) {
requestAnimationFrame(animate);
TWEEN.update();
if(step === 0) {
envelopeGroup.rotation.y = Math.sin(time * 0.001) * 0.12;
envelopeGroup.rotation.x = Math.cos(time * 0.001) * 0.08;
} else if(step === 1 || step === 2) {
bouquetGroup.rotation.y += 0.006;
}
for (let i = 0; i < particleCount; i++) {
let y = posAttribute.getY(i);
y -= speedsArr[i];
if (y < -10) {
y = 10;
posAttribute.setX(i, (Math.random() - 0.5) * 20);
}
posAttribute.setY(i, y);
}
posAttribute.needsUpdate = true;
flowerParticles.rotation.y += 0.0008;
renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
