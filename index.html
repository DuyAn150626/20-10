<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Yêu 3D - 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2a082c 0%, #08000a 100%);
            overflow: hidden;
            perspective: 1000px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .instruction {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #ff9ebb;
            font-size: 1.1rem;
            z-index: 100;
            text-shadow: 0 0 10px rgba(255, 75, 145, 0.5);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        /* KHÔNG GIAN CHỨA THƯ VÀ HOA */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transform: rotateX(15deg);
            transition: transform 1s ease;
        }

        /* BAO THƯ NỀN */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #ff75a0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 10;
        }

        /* NẮP THƯ TAM GIÁC 3D */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #ff4b91;
            transform-origin: top;
            transition: transform 0.8s ease 0.5s, z-index 0.2s ease 0.8s;
            z-index: 30;
        }

        /* MẶT TRƯỚC BAO THƯ GẤP CHÉO */
        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #ff85a9;
            border-right: 150px solid #ff85a9;
            border-bottom: 100px solid #ff6593;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 25;
        }

        /* BÓ HOA GIẤU TRONG THƯ */
        .bouquet {
            position: absolute;
            bottom: 20px;
            left: 75px;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ffb3c6, #ff85a9);
            border-radius: 150px 150px 20px 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s;
            transform: translateY(0) scale(0.3);
            z-index: 5;
            transform-style: preserve-3d;
        }

        /* CÁC BÔNG HOA HỒNG XUNG QUANH */
        .flower {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff69b4;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .fl1 { top: 15px; left: 20px; }
        .fl2 { top: 10px; left: 55px; }
        .fl3 { top: 15px; right: 20px; }
        .fl4 { top: 45px; left: 15px; }
        .fl5 { top: 45px; right: 15px; }

        /* BÔNG HỒNG ĐỎ CHÍNH GIỮA */
        .red-rose {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: #dc143c;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(220, 20, 60, 0.6), inset 0 0 15px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }

        /* TRẠNG THÁI 1: BẤM MỞ THƯ -> TRỒI HOA */
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .bouquet {
            transform: translateY(-130px) scale(1.4) translateZ(50px);
            z-index: 15;
        }

        /* TRẠNG THÁI 2: BẤM VÀO HOA ĐỎ -> PHÓNG TO HOA SÁT CAMERA */
        .envelope-wrapper.zoom {
            transform: rotateX(10deg) scale(1.3) translateY(-30px);
        }

        .envelope-wrapper.zoom .red-rose {
            transform: translateX(-50%) scale(1.2);
            animation: pulseRose 1s infinite alternate;
        }

        @keyframes pulseRose {
            0% { box-shadow: 0 5px 15px rgba(220, 20, 60, 0.6); }
            100% { box-shadow: 0 5px 30px rgba(220, 20, 60, 1); }
        }

        /* THIỆP CHÚC MỪNG HIỆN RA */
        .wishes-card {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 158, 187, 0.3);
            border-radius: 20px;
            padding: 25px 30px;
            width: 85%;
            max-width: 450px;
            color: #fff;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 200;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .wishes-card.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .wishes-card h2 { color: #ff4b91; margin-bottom: 10px; font-size: 1.8rem; }
        .wishes-card p { font-size: 1rem; line-height: 1.6; color: #ffe3ec; }

        /* HỆ THỐNG HOA RƠI NỀN */
        .petal {
            position: absolute;
            background-color: #ffb3d1;
            border-radius: 150px 0 150px 150px;
            opacity: 0.7;
            pointer-events: none;
            animation: fly linear infinite;
        }

        @keyframes fly {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="instruction" id="guide">✉️ Hãy chạm vào bức thư màu hồng để mở điều bất ngờ 🌸</div>

    <div class="envelope-wrapper" id="letter">
        <div class="envelope"></div>
        <div class="bouquet" id="flower-bouquet">
            <div class="flower fl1"></div>
            <div class="flower fl2"></div>
            <div class="flower fl3"></div>
            <div class="flower fl4"></div>
            <div class="flower fl5"></div>
            <div class="red-rose" id="main-rose"></div>
        </div>
    </div>

    <div class="wishes-card" id="wishes">
        <h2>Happy 20/10! 💐</h2>
        <p>Chúc người phụ nữ tuyệt vời nhận được bức thư này luôn rạng rỡ như đóa hoa hồng đỏ thắm, tràn đầy hạnh phúc, niềm vui và luôn được yêu thương trọn vẹn mỗi ngày!</p>
    </div>

    <!-- Nhạc nền nhẹ nhàng tự động phát khi chạm -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <script>
        const letter = document.getElementById('letter');
        const wishes = document.getElementById('wishes');
        const guide = document.getElementById('guide');
        const mainRose = document.getElementById('main-rose');
        const bgMusic = document.getElementById('bg-music');
        let currentStep = 0;

        // Xử lý chuỗi tương tác bấm chuột / chạm màn hình điện thoại
        letter.addEventListener('click', function(e) {
            // Tự động kích hoạt phát nhạc nền khi chạm lần đầu
            if (bgMusic.paused) {
                bgMusic.play().catch(() => {});
            }

            if (currentStep === 0) {
                // Bước 1: Mở nắp thư và đẩy bó hoa trồi lên
                letter.classList.add('open');
                guide.innerText = "🌹 Hãy chạm vào đóa hoa hồng đỏ ở giữa...";
                currentStep = 1;
            } else if (currentStep === 1) {
                // Bước 2: Chỉ khi bấm trúng hoặc sau khi mở hoa, kích hoạt phóng đại hiển thị lời chúc
                letter.classList.add('zoom');
                wishes.classList.add('show');
                guide.style.display = 'none';
                currentStep = 2;
            }
        });

        // Tạo hiệu ứng cánh hoa rơi lãng mạn liên tục trên nền
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Cấu hình ngẫu nhiên kích thước và vị trí cho sinh động
            const size = Math.random() * 12 + 8;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 5 + 4;
            petal.style.animationDuration = duration + 's';
            
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, duration * 1000);
        }
        setInterval(createPetal, 150);
    </script>
</body>
</html>
